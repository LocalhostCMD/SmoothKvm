[package]
name = "kvmd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "SmoothKvm"
path = "src/main.rs"

[dependencies]
kvm-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
getrandom.workspace = true
tiny_http.workspace = true
# Ed25519 signature check of update manifests (both already used by the Noise library; no new code pulled in)
curve25519-dalek = { version = "4", default-features = false }
sha2 = "0.10"
# deflate for the window-streaming tiles (pure Rust; already in the lockfile)
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"

[dependencies.ratatui]
version = "0.30"
