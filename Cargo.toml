[workspace]
resolver = "2"
members = ["crates/protocol", "crates/daemon", "crates/launcher"]

[workspace.package]
version = "0.4.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = "1"
snow = "0.9"
serde_json = "1"
getrandom = "0.2"
tiny_http = "0.12"
